schema_version: 1
tool_version: v1.2.0
tool_checksums_sha256: 7de6de3a14184eced8c0114bf802cb24a808f3e1592d358f6f6f3d02552d0e27

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./routertest

operations:
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: safety
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: integration
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzRoutePatternCompilation$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzNamedRouteRoundTrip$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzRequestTargets$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzHostMatching$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzGroupComposition$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzURLGenerationInputs$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
